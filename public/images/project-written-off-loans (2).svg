<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Contrôle centralisé des crédits radiés</title>
  <desc id="desc">Plus de cent bases de données alimentent une recherche sécurisée donnant accès à l'historique de crédit, aux incidents de remboursement et à l'agence d'origine.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="30" x2="840" y2="570" gradientUnits="userSpaceOnUse"><stop stop-color="#081B33"/><stop offset="1" stop-color="#123A5F"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FCFF"/><stop offset="1" stop-color="#DCEEF7"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020A13" flood-opacity=".28"/></filter>
  </defs>
  <rect width="900" height="600" rx="30" fill="url(#bg)"/>
  <circle cx="805" cy="75" r="130" fill="#38BDF8" opacity=".08"/><circle cx="80" cy="550" r="150" fill="#2563EB" opacity=".07"/>

  <!-- Flux centralisé -->
  <path d="M275 300h86m178 0h76" fill="none" stroke="#6CC9ED" stroke-width="5" stroke-linecap="round" opacity=".75"/>
  <path d="m351 287 23 13-23 13Zm254 0 23 13-23 13Z" fill="#6CC9ED"/>

  <!-- Plus de 100 bases distribuées -->
  <g filter="url(#shadow)">
    <rect x="75" y="152" width="210" height="296" rx="27" fill="url(#card)"/>
    <g transform="translate(106 192)">
      <ellipse cx="55" cy="25" rx="55" ry="20" fill="#67D2F6"/>
      <path d="M0 25v66c0 11 25 20 55 20s55-9 55-20V25" fill="#2588D8"/>
      <ellipse cx="55" cy="58" rx="55" ry="20" fill="#287CC5" stroke="#A7E8FB" stroke-width="3"/>
      <ellipse cx="55" cy="91" rx="55" ry="20" fill="#2164A8" stroke="#A7E8FB" stroke-width="3"/>
      <ellipse cx="55" cy="25" rx="55" ry="20" fill="none" stroke="#D6F7FF" stroke-width="3"/>
    </g>
    <g fill="#1C608E" opacity=".75">
      <ellipse cx="215" cy="229" rx="28" ry="11"/><path d="M187 229v38c0 6 13 11 28 11s28-5 28-11v-38Z"/>
      <ellipse cx="135" cy="345" rx="28" ry="11"/><path d="M107 345v38c0 6 13 11 28 11s28-5 28-11v-38Z"/>
      <ellipse cx="222" cy="363" rx="28" ry="11"/><path d="M194 363v38c0 6 13 11 28 11s28-5 28-11v-38Z"/>
    </g>
    <rect x="104" y="405" width="152" height="28" rx="14" fill="#0D2B48"/>
    <text x="180" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#D8F5FF">100+ BASES</text>
  </g>

  <!-- Recherche sécurisée du membre -->
  <g filter="url(#shadow)">
    <rect x="360" y="174" width="180" height="252" rx="27" fill="#0D2B48" stroke="#4C8DB4" stroke-width="3"/>
    <circle cx="450" cy="249" r="44" fill="#DCEFF8"/>
    <circle cx="450" cy="236" r="15" fill="#327DA9"/>
    <path d="M421 274c6-26 52-26 58 0" fill="#327DA9"/>
    <rect x="389" y="316" width="122" height="38" rx="19" fill="#F7FBFF"/>
    <circle cx="411" cy="335" r="9" fill="none" stroke="#327DA9" stroke-width="4"/><path d="m418 342 8 8" stroke="#327DA9" stroke-width="4" stroke-linecap="round"/>
    <rect x="438" y="330" width="52" height="8" rx="4" fill="#91ADBC"/>
    <circle cx="500" cy="390" r="31" fill="#113A5A" stroke="#75D4F3" stroke-width="4"/>
    <rect x="487" y="385" width="26" height="22" rx="6" fill="#4ADE80"/>
    <path d="M491 385v-7a9 9 0 0 1 18 0v7" fill="none" stroke="#4ADE80" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Résultats filtrables et décision -->
  <g filter="url(#shadow)">
    <rect x="614" y="128" width="222" height="344" rx="27" fill="url(#card)"/>
    <rect x="638" y="154" width="174" height="42" rx="13" fill="#0D2B48"/>
    <circle cx="663" cy="175" r="8" fill="#4ADE80"/><rect x="680" y="168" width="91" height="8" rx="4" fill="#D2F0FB"/>

    <g transform="translate(640 218)">
      <rect width="170" height="47" rx="12" fill="#FFFFFF"/><circle cx="22" cy="23" r="10" fill="#F59E0B"/><path d="M22 17v7m0 6v1" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><rect x="45" y="13" width="87" height="8" rx="4" fill="#769CAF"/><rect x="45" y="29" width="61" height="6" rx="3" fill="#C0D5DF"/>
      <rect y="59" width="170" height="47" rx="12" fill="#FFFFFF"/><path d="M22 70c13 0 13 20 0 26-13-6-13-26 0-26Z" fill="#2563EB"/><circle cx="22" cy="80" r="4" fill="#FFFFFF"/><rect x="45" y="72" width="87" height="8" rx="4" fill="#769CAF"/><rect x="45" y="88" width="61" height="6" rx="3" fill="#C0D5DF"/>
      <rect y="118" width="170" height="47" rx="12" fill="#FFFFFF"/><circle cx="22" cy="141" r="10" fill="#EF4444"/><path d="m17 136 10 10m0-10-10 10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><rect x="45" y="131" width="87" height="8" rx="4" fill="#769CAF"/><rect x="45" y="147" width="61" height="6" rx="3" fill="#C0D5DF"/>
    </g>

    <rect x="640" y="399" width="170" height="45" rx="14" fill="#0D2B48"/>
    <path d="M664 413v18m-8-12h16" stroke="#75D4F3" stroke-width="4" stroke-linecap="round"/>
    <rect x="688" y="414" width="92" height="7" rx="3" fill="#B9D9E8"/><rect x="688" y="428" width="61" height="5" rx="2" fill="#668DA4"/>
  </g>

  <!-- Contrôle avant octroi -->
  <g opacity=".72"><rect x="330" y="491" width="310" height="51" rx="17" fill="#0B2946" stroke="#3F789D" stroke-width="2"/><circle cx="363" cy="516" r="11" fill="#FBBF24"/><path d="M363 509v8m0 6v1" stroke="#0B2946" stroke-width="3" stroke-linecap="round"/><rect x="389" y="507" width="205" height="8" rx="4" fill="#B9D9E8"/><rect x="389" y="524" width="137" height="6" rx="3" fill="#668DA4"/></g>
</svg>
