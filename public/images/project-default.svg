<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Illustration générique de projet numérique</title>
  <desc id="desc">Interface web moderne combinant développement, données, visualisation et validation.</desc>
  <defs>
    <linearGradient id="bg" x1="55" y1="35" x2="850" y2="570" gradientUnits="userSpaceOnUse"><stop stop-color="#081B33"/><stop offset="1" stop-color="#123A5F"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FCFF"/><stop offset="1" stop-color="#DCEEF7"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#020A13" flood-opacity=".3"/></filter>
  </defs>

  <rect width="900" height="600" rx="30" fill="url(#bg)"/>
  <circle cx="800" cy="82" r="135" fill="#38BDF8" opacity=".08"/><circle cx="88" cy="548" r="150" fill="#2563EB" opacity=".07"/>
  <g opacity=".12" stroke="#D8F5FF"><path d="M70 95h760M70 155h760M70 215h760M70 275h760M70 335h760M70 395h760M70 455h760M70 515h760M130 55v490M210 55v490M290 55v490M370 55v490M450 55v490M530 55v490M610 55v490M690 55v490M770 55v490"/></g>

  <!-- Fenêtre principale -->
  <g filter="url(#shadow)">
    <rect x="132" y="104" width="636" height="392" rx="28" fill="url(#screen)"/>
    <path d="M160 104h580a28 28 0 0 1 28 28v49H132v-49a28 28 0 0 1 28-28Z" fill="#0D2B48"/>
    <circle cx="172" cy="143" r="7" fill="#FB7185"/><circle cx="198" cy="143" r="7" fill="#FBBF24"/><circle cx="224" cy="143" r="7" fill="#4ADE80"/>
    <rect x="272" y="135" width="211" height="16" rx="8" fill="#D8F5FF" opacity=".72"/>

    <!-- Navigation -->
    <rect x="159" y="209" width="133" height="258" rx="19" fill="#E7F1F7"/>
    <circle cx="225" cy="251" r="24" fill="url(#accent)"/>
    <path d="m216 251 7 7 14-16" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#91AEBE"><rect x="184" y="300" width="82" height="9" rx="4"/><rect x="184" y="331" width="63" height="9" rx="4"/><rect x="184" y="362" width="72" height="9" rx="4"/><rect x="184" y="393" width="52" height="9" rx="4"/></g>

    <!-- Code -->
    <rect x="318" y="209" width="242" height="154" rx="19" fill="#0D2B48"/>
    <g fill="none" stroke-linecap="round" stroke-width="7"><path d="m357 250-18 18 18 18" stroke="#67D2F6"/><path d="m521 250 18 18-18 18" stroke="#67D2F6"/><path d="m458 237-38 63" stroke="#FBBF24"/></g>
    <g fill="#668DA4"><rect x="347" y="323" width="174" height="7" rx="3"/><rect x="347" y="340" width="113" height="6" rx="3"/></g>

    <!-- Tableau de bord -->
    <rect x="586" y="209" width="155" height="154" rx="19" fill="#FFFFFF"/>
    <path d="M612 327v-40h20v40Zm34 0v-73h20v73Zm34 0v-55h20v55Z" fill="url(#accent)"/>
    <path d="M607 328h101" stroke="#A8C2D0" stroke-width="3" stroke-linecap="round"/>
    <rect x="610" y="232" width="70" height="8" rx="4" fill="#8AAABA"/>

    <!-- Données et progression -->
    <rect x="318" y="387" width="423" height="80" rx="19" fill="#FFFFFF"/>
    <circle cx="358" cy="427" r="22" fill="#DCFCE7"/><path d="m347 427 8 8 16-19" fill="none" stroke="#22C55E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="396" y="410" width="270" height="10" rx="5" fill="#C5D8E2"/><rect x="396" y="410" width="205" height="10" rx="5" fill="#2588D8"/>
    <rect x="396" y="438" width="141" height="7" rx="3" fill="#8BAABA"/>
  </g>

  <!-- Éléments flottants -->
  <g filter="url(#shadow)">
    <circle cx="748" cy="444" r="54" fill="#0D2B48" stroke="#76D4F3" stroke-width="4"/>
    <ellipse cx="748" cy="426" rx="24" ry="9" fill="#73D8F7"/><path d="M724 426v31c0 5 11 9 24 9s24-4 24-9v-31" fill="#2588D8"/><ellipse cx="748" cy="442" rx="24" ry="9" fill="#287BC3" stroke="#A8EAFB" stroke-width="2"/><ellipse cx="748" cy="457" rx="24" ry="9" fill="#2164A8" stroke="#A8EAFB" stroke-width="2"/>
  </g>
  <g filter="url(#shadow)"><circle cx="156" cy="451" r="42" fill="#0D2B48" stroke="#76D4F3" stroke-width="4"/><path d="M139 451h34M156 434v34" stroke="#4ADE80" stroke-width="7" stroke-linecap="round"/></g>
</svg>
