<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Application bancaire de gestion du gel de fonds</title>
  <desc id="desc">Illustration légère d'un compte bancaire, d'une échéance et d'un montant sécurisé par un cadenas.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="40" x2="830" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081B33"/>
      <stop offset="1" stop-color="#123A5F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FCFF"/>
      <stop offset="1" stop-color="#DCEEF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020A13" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="900" height="600" rx="30" fill="url(#bg)"/>
  <circle cx="789" cy="84" r="128" fill="#38BDF8" opacity=".08"/>
  <circle cx="92" cy="546" r="150" fill="#2563EB" opacity=".07"/>

  <!-- Flux de traitement -->
  <path d="M296 300h106M510 300h94" fill="none" stroke="#73CBEF" stroke-width="5" stroke-linecap="round" opacity=".75"/>
  <path d="m393 287 22 13-22 13ZM595 287l22 13-22 13Z" fill="#73CBEF"/>

  <!-- Compte bancaire -->
  <g filter="url(#shadow)">
    <rect x="105" y="187" width="205" height="226" rx="25" fill="url(#card)"/>
    <circle cx="207" cy="247" r="36" fill="#D9EEF8"/>
    <circle cx="207" cy="236" r="13" fill="#327DA9"/>
    <path d="M183 269c5-21 43-21 48 0" fill="#327DA9"/>
    <rect x="145" y="307" width="125" height="12" rx="6" fill="#7DA4B8"/>
    <rect x="164" y="338" width="87" height="25" rx="10" fill="#2563EB"/>
  </g>

  <!-- Règle métier / échéance -->
  <g filter="url(#shadow)">
    <circle cx="456" cy="300" r="74" fill="#0D2B48" stroke="#65B9DC" stroke-width="4"/>
    <circle cx="456" cy="300" r="48" fill="#153D5D" stroke="#C6ECFA" stroke-width="4"/>
    <path d="M456 300v-27M456 300l24 15" fill="none" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
    <circle cx="456" cy="300" r="7" fill="#FBBF24"/>
  </g>

  <!-- Fonds sécurisés -->
  <g filter="url(#shadow)">
    <rect x="603" y="187" width="192" height="226" rx="25" fill="url(#card)"/>
    <ellipse cx="699" cy="250" rx="52" ry="19" fill="#6BD2F4"/>
    <path d="M647 250v63c0 11 23 19 52 19s52-8 52-19v-63" fill="#2588D8"/>
    <ellipse cx="699" cy="282" rx="52" ry="19" fill="#287CC5" stroke="#A8E9FC" stroke-width="3"/>
    <ellipse cx="699" cy="313" rx="52" ry="19" fill="#2165AA" stroke="#A8E9FC" stroke-width="3"/>
    <rect x="668" y="324" width="62" height="57" rx="12" fill="#123B5C" stroke="#73D3F3" stroke-width="4"/>
    <path d="M682 324v-13a17 17 0 0 1 34 0v13" fill="none" stroke="#73D3F3" stroke-width="6" stroke-linecap="round"/>
    <path d="m686 352 9 9 18-21" fill="none" stroke="#4ADE80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Petites informations secondaires -->
  <g opacity=".65">
    <rect x="337" y="425" width="238" height="54" rx="18" fill="#0B2946" stroke="#3F789D" stroke-width="2"/>
    <circle cx="370" cy="452" r="11" fill="#4ADE80"/>
    <rect x="394" y="443" width="143" height="9" rx="4" fill="#B9D9E8"/>
    <rect x="394" y="461" width="94" height="7" rx="3" fill="#668DA4"/>
  </g>
</svg>
