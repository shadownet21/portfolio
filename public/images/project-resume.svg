    <path d="M1051 165v69h69" fill="#C9E3F5"/>
    <rect x="820" y="165" width="72" height="500" rx="30" fill="#0B2947"/>
    <circle cx="856" cy="253" r="22" fill="#5EA7FF"/>
    <circle cx="856" cy="246" r="7" fill="#EAF6FF"/><path d="M843 267c3-9 8-13 13-13s10 4 13 13" fill="#EAF6FF"/>
    <rect x="838" y="311" width="36" height="7" rx="3.5" fill="#9DC9E8"/>
    <rect x="838" y="335" width="29" height="6" rx="3" fill="#608EAE"/>
    <rect x="838" y="359" width="34" height="6" rx="3" fill="#608EAE"/>
    <rect x="838" y="421" width="36" height="7" rx="3.5" fill="#9DC9E8"/>
    <rect x="838" y="445" width="31" height="6" rx="3" fill="#608EAE"/>
    <rect x="838" y="469" width="27" height="6" rx="3" fill="#608EAE"/>
    <rect x="928" y="253" width="134" height="17" rx="8.5" fill="#234F70"/>
    <rect x="928" y="286" width="92" height="10" rx="5" fill="#7E9DB4"/>
    <rect x="928" y="347" width="112" height="13" rx="6.5" fill="#2F80ED"/>
    <rect x="928" y="381" width="146" height="9" rx="4.5" fill="#7595AC"/>
    <rect x="928" y="405" width="126" height="9" rx="4.5" fill="#AEC3D1"/>
    <rect x="928" y="429" width="151" height="9" rx="4.5" fill="#AEC3D1"/>
    <rect x="928" y="484" width="96" height="13" rx="6.5" fill="#2F80ED"/>
    <rect x="928" y="518" width="151" height="9" rx="4.5" fill="#7595AC"/>
    <rect x="928" y="542" width="128" height="9" rx="4.5" fill="#AEC3D1"/>
    <rect x="928" y="566" width="143" height="9" rx="4.5" fill="#AEC3D1"/>
    <rect x="928" y="609" width="64" height="18" rx="9" fill="#DCECF7"/><rect x="1002" y="609" width="77" height="18" rx="9" fill="#DCECF7"/>
  </g>

  <!-- Validation -->
  <g transform="translate(796 605)" filter="url(#shadow)">
    <circle r="48" fill="#0A2947" stroke="#A5ECFF" stroke-width="4"/>
    <path d="M0-27c15 10 26 10 26 10V5c0 17-11 28-26 35C-15 33-26 22-26 5v-22s11 0 26-10Z" fill="#22C55E"/>
    <path d="m-13 6 9 9 19-21" fill="none" stroke="#FFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
